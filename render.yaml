databases:
  - name: hospicore-demo-db
    databaseName: hospicore
    user: hospicore
    plan: free

services:
  - type: web
    name: hospicore-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WEB_ORIGIN
        value: https://hospicore-demo.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hospicore-demo-db
          property: connectionString
