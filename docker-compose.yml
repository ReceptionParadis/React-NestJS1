services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospicore
      POSTGRES_PASSWORD: hospicore
      POSTGRES_DB: hospicore
    ports:
      - "5432:5432"
    volumes:
      - hospicore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospicore -d hospicore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hospicore-redis:/data

volumes:
  hospicore-postgres:
  hospicore-redis:
